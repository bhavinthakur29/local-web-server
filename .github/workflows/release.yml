name: Release builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build and package
        shell: pwsh
        run: |
          ./build.ps1
          ./package-release.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: TekServeLocal-Windows.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tkinter (required for GUI)
        run: sudo apt-get update && sudo apt-get install -y python3-tk python3-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build and package
        run: |
          chmod +x build.sh package-release.sh
          ./build.sh
          ./package-release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: TekServeLocal-Linux.tar.gz

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify tkinter
        run: python3 -c "import tkinter"

      - name: Build and package
        run: |
          chmod +x build-mac.sh package-release-mac.sh
          ./build-mac.sh
          ./package-release-mac.sh

      - uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: TekServeLocal-Mac.zip

  publish:
    needs: [build-windows, build-linux, build-mac]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-build"
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            TekServeLocal-Windows.zip
            TekServeLocal-Linux.tar.gz
            TekServeLocal-Mac.zip
          generate_release_notes: true
